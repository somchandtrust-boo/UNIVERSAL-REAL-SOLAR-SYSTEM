<!DOCTYPE html>
<html lang="hi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        UNIVERSAL REAL SOLAR SYSTEM
    </title>

    <!-- Three.js -->
    <script
        src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js">
    </script>

    <!-- Import Map -->
    <script type="importmap">
    {
        "imports": {
            "three":
            "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

            "three/addons/":
            "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<!-- =====================================================
     3D SOLAR SYSTEM
====================================================== -->

<div id="solar-system"></div>


<!-- =====================================================
     TOP HUD
====================================================== -->

<div class="hud">


    <div class="brand">

        <div class="brand-main">
            UNIVERSAL
        </div>

        <div class="brand-sub">
            REAL SOLAR SYSTEM
        </div>

    </div>


    <div class="live-status">

        <span class="status-light"></span>

        <span>
            JPL DATA SYSTEM
        </span>

    </div>


    <!-- =================================================
         INFORMATION PANEL
    ================================================== -->

    <div
        id="planet-info"
        class="planet-info"
    >

        <div class="info-title">
            SOLAR SYSTEM
        </div>

        <div class="info-text">
            किसी planet पर click करें
        </div>

    </div>


    <!-- =================================================
         DATA STATUS
    ================================================== -->

    <div class="data-status">

        <div>
            DATA SOURCE
        </div>

        <strong>
            NASA / JPL HORIZONS
        </strong>

        <small>
            Astronomical Ephemeris
        </small>

    </div>


    <!-- =================================================
         CONTROLS
    ================================================== -->

    <div class="controls">

        <button id="resetView">
            RESET
        </button>

        <button id="toggleOrbits">
            ORBITS
        </button>

        <button id="toggleLabels">
            LABELS
        </button>

        <button id="realTime">
            REAL TIME
        </button>

    </div>


    <!-- =================================================
         LOADING
    ================================================== -->

    <div
        id="loading"
        class="loading"
    >

        <div class="loading-title">
            INITIALIZING SOLAR SYSTEM
        </div>

        <div class="loading-bar">
            <span></span>
        </div>

        <div class="loading-text">
            Loading astronomical system...
        </div>

    </div>


</div>


<!-- =====================================================
     MAIN JS
====================================================== -->

<script
    type="module"
    src="script.js">
</script>


</body>

</html>
