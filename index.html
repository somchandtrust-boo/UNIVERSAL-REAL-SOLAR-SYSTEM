<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Universal Real Solar System</title>

<link rel="stylesheet" href="style.css">

<!-- THREE.JS IMPORT MAP -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>

<body>

<div id="solar-system"></div>

<!-- TOP HUD -->
<header class="hud-top">

    <div class="brand">
        <div class="brand-main">
            UNIVERSAL
        </div>

        <div class="brand-sub">
            REAL SOLAR SYSTEM
        </div>
    </div>

    <div class="data-status">
        <span class="status-dot"></span>
        <span id="jplStatus">
            CONNECTING TO JPL...
        </span>
    </div>

</header>


<!-- PLANET INFORMATION -->
<section id="planet-info" class="planet-info">

    <div class="info-title">
        OBJECT INFORMATION
    </div>

    <div id="selected-name">
        SELECT PLANET
    </div>

    <div id="selected-data">
        Click any planetary body
    </div>

</section>


<!-- CURRENT TIME -->
<div class="time-panel">

    <div class="time-label">
        JPL EPHEMERIS TIME
    </div>

    <div id="current-time">
        --
    </div>

</div>


<!-- CONTROLS -->
<div class="controls">

    <button id="resetView">
        RESET VIEW
    </button>

    <button id="toggleOrbits">
        ORBITS
    </button>

    <button id="toggleLabels">
        LABELS
    </button>

    <button id="realTime">
        REAL TIME
    </button>

</div>


<!-- LOADING -->
<div id="loading">

    <div class="loader-ring"></div>

    <div class="loading-title">
        LOADING REAL SOLAR SYSTEM
    </div>

    <div id="loading-text">
        Connecting to NASA/JPL Horizons...
    </div>

</div>


<script type="module" src="script.js"></script>

</body>
</html>
